<html>
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap"
      rel="stylesheet"
    />

    <div class="gift-section">
      <h2 class="gift-title">And kind 🥹</h2>
      <div class="gift-img" id="gift-img-kind"></div>
    </div>

    <div class="gift-section">
      <h2 class="gift-title">And SO funny 😂</h2>
      <div class="gift-img" id="gift-img-funny"></div>
    </div>

    <div class="gift-section">
      <h2 class="gift-title">And beautiful! 😍</h2>
      <div class="gift-img" id="gift-img-beautiful"></div>
    </div>

    <p>I wish you all the best! ❤️</p>
